# INTERNAL SELF-TEST — not a real creative brief.
#
# Exercises every pipeline capability (trim, reorder, cut + xfade
# transitions, slow zoom, 9:16 blur_pad, 4:5 crop, text overlay, CTA,
# audio mix, export, QC) against synthetic placeholder footage, so the
# whole run_edit.py path can be verified with zero real Zaviqu source
# material. Safe to re-run any time as a smoke test:
#
#   python3 video-editing/scripts/run_edit.py --brief video-editing/briefs/_pipeline_selftest.yaml
#
# Requires video-editing/source/smoke_test_raw.mp4 — intentionally NOT
# committed (it's synthetic placeholder footage, not real Zaviqu video).
# Regenerate it with:
#
#   cd video-editing/source
#   ffmpeg -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=9" \
#     -f lavfi -i "sine=frequency=300:duration=9" \
#     -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest seg1.mp4
#   ffmpeg -y -f lavfi -i "smptebars=size=1280x720:rate=30:duration=8" \
#     -f lavfi -i "sine=frequency=500:duration=8" \
#     -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest seg2.mp4
#   ffmpeg -y -f lavfi -i "mandelbrot=size=1280x720:rate=30:end_scale=0.1" -t 8 \
#     -f lavfi -i "sine=frequency=700:duration=8" \
#     -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest seg3.mp4
#   ffmpeg -y -i seg1.mp4 -i seg2.mp4 -i seg3.mp4 \
#     -filter_complex "[0:v][0:a][1:v][1:a][2:v][2:a]concat=n=3:v=1:a=1[v][a]" \
#     -map "[v]" -map "[a]" -c:v libx264 -pix_fmt yuv420p -c:a aac smoke_test_raw.mp4
#   rm seg1.mp4 seg2.mp4 seg3.mp4

name: pipeline_selftest

source_file: smoke_test_raw.mp4

platform: instagram_facebook
final_duration:
  min: 8
  max: 15
hook: "Self-test only — proves the pipeline runs end to end."
cover_frame: 2.0

timestamp_cuts:
  - id: card
    start: 1.0
    end: 3.0
  - id: reveal
    start: 10.0
    end: 14.5
  - id: closeup
    start: 19.0
    end: 22.0

scene_order: [card, reveal, closeup]

transitions:
  - type: cut
  - type: xfade
    style: fade
    duration: 0.4

motion:
  - scene: reveal
    direction: in
    zoom_end: 1.06

on_screen_text:
  - text: "ZAVIQU"
    start: 0.0
    end: 1.6
    position: top
    size: 72
    color: gold
    box: false
  - text: "Create yours at ZAVIQU"
    start: 5.0
    end: 7.3
    position: bottom
    size: 68
    color: white

captions: []

music_direction:
  track: null
  volume: 0.45
  original_volume: 0.9
  duck: false

cta:
  text: "Create yours at ZAVIQU"
  duration: 1.8
  color: "#D4AF37"

export_versions:
  - platform: instagram_facebook
    aspect: "9:16"
    resize_mode: blur_pad
    with_text: true
    no_text_copy: true
  - platform: instagram_facebook
    aspect: "4:5"
    resize_mode: crop
    with_text: true
    no_text_copy: true
