# Real production brief — "VIDEO 009 - Necklace Reveal 2" client notes,
# implemented against eb4fe2a2-009__Necklace_Reveal_2.mp4 (copied in as
# source/necklace_reveal_2_raw.mp4).
#
# Source is 15.069s, 960x960 (1:1), 24fps, with audio — same template as
# the previous eight source videos.
#
# REVISION: the first pass split this source into 5 scenes at its own
# real internal hard cuts (verified genuine cuts, not introduced by us)
# and added light camera motion to the 4 static ones. Client feedback:
# "the original pacing feels more luxurious and the music flows
# naturally... introduces cuts that make the music and rhythm feel less
# premium... revert to the original unedited version." Even though those
# cut points were never moved and no shot was reordered, splitting the
# file into 5 independently-trimmed/re-encoded scenes and reassembling
# them meant the audio was cut and concatenated at each boundary too —
# almost certainly the source of the "less premium" rhythm even though
# the music content itself didn't change.
#
# Fix: process the whole source as ONE unbroken scene — a single trim,
# single continuous grade pass, single continuous audio pass — so the
# original cuts stay exactly as filmed (baked into one untouched file,
# never independently re-encoded) and the music is one unbroken pass with
# no concatenation points at all. No added camera motion this time either
# (even a subtle push-in changes the framing rhythm from the original —
# "do not... change the pacing"). Only two things are genuinely new: a
# single light color-grade pass, and the tail trim needed to attach the
# new ending (see below) — everything else is the original file, untouched.
#
# The tail trim is still required: this source has the same old baked-in
# ending as Videos 002/005/007 — a white italic tagline ("Made to be
# Tresured," the source's own spelling) fading in near the natural end,
# confirmed via frame-by-frame inspection (clean at frame 284/t=11.833s,
# faint text visible by frame 290/t=12.083s). "Replace the previous
# ending completely" and "do not trim shots" aren't in tension here — the
# old ending isn't one of the five real product shots, it's a separate
# baked-in outro layered on the tail of the last shot, so trimming right
# before it (11.7s, same cutoff as the first pass) removes only that old
# outro, not any content shot.

name: necklace_reveal_2_v1

source_file: necklace_reveal_2_raw.mp4

platform: instagram_facebook
final_duration:
  min: 13.0
  max: 15.2
hook: "Existing box-opening reveal reads instantly — keep it, first ~3 seconds are the hook."
cover_frame: 9.8   # lands in the hero close-up on the card, before the pull-back begins

# --- ONE scene: the entire original sequence, untouched, minus the old-ending tail ---
# Body 11.7s + the signature ending's additive 1.8s tail (black_hold +
# final_fade_out) = 13.5s, inside the 13-15s target — same numbers as the
# first pass, since the trim point didn't change, only the fact that
# everything before it is now one unbroken piece instead of five.
timestamp_cuts:
  - id: necklace_reveal_2_full
    start: 0.000
    end: 11.700

scene_order:
  - necklace_reveal_2_full

# No cuts — this is the original file's own internal cuts, preserved
# exactly as filmed inside one untouched clip, not scenes we're splicing.
transitions: []

# No added motion anywhere — "keep the original pacing... do not change
# the pacing." The original camera work (static in four of the five
# shots, a real pull-back in the fifth) plays exactly as filmed.
motion: []

# ONE light grading pass for the whole piece — "only apply light visual
# polishing (slight warmth, subtle micro-contrast, gentle sharpening
# where appropriate)." Deliberately lighter than the first pass's
# per-scene values (which ranged up to sharpen=0.2) and skips the
# separate campaign-wide global_grade layer this time so the two don't
# compound into something heavier than "light" — this is the client's
# explicit ask for restraint on this specific video, taking priority over
# the standing cross-campaign grade-matching default.
scene_grade:
  - scene: necklace_reveal_2_full
    warmth: 0.035
    contrast: 0.02
    sharpen: 0.12

on_screen_text: []
captions: []

# "Keep the original music" — same consistent campaign-wide loudness
# target as every other video (a separate, still-active campaign
# requirement, not something this feedback touched), applied as a single
# continuous pass over the whole file rather than per-scene, so there's
# no concatenation point anywhere in the audio at all.
music_direction:
  track: null
  target_lufs: -15.0
  target_tp: -1.0
  target_lra: 15.0
  duck: false

audio_swell: []

# No separate global_grade pass this time — see the scene_grade note above.
global_grade: {}

# SIGNATURE ENDING — identical parameters to every previous video in the
# campaign per "replace the previous ending completely with the official
# ZAVIQU ending." Same lockup, same brand promise, same website, same
# timings. No freeze frame: real footage (the original pull-back to the
# full box) keeps playing and its audio keeps playing while the lockup
# fades in; picture+audio then fade to black together; a plain black hold
# (no freeze — there's no frame here) keeps the gold text briefly visible
# before everything fades out. Replaces the old misspelled white-text
# ending entirely (it never appears in this edit).
logo_fade_ending:
  lockup: brand-assets/logo/zaviqu-lockup-reference.png
  brand_promise: "The Gift That Says What Words Can't."
  website: "zaviqu.com"
  fade_in: 1.0
  hold_visible: 2.0
  fade_to_black: 1.2
  black_hold: 1.0
  final_fade_out: 0.8
  gold_color: "#D4AF37"

export_versions:
  - platform: instagram_facebook
    aspect: "9:16"
    resize_mode: blur_pad   # source is 1:1 — blur_pad keeps the full frame, never crops the product out
    with_text: true
    no_text_copy: true
  - platform: instagram_facebook
    aspect: "4:5"
    resize_mode: blur_pad
    with_text: true
    no_text_copy: true
