<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaviqu — Fine Jewelry for Meaningful Moments</title>
<meta name="description" content="Zaviqu — premium, personalized jewelry for the moments and people that matter most.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="container site-header__row">
    <a href="index.html" class="logo">ZAVIQU</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="#">Shop</a>
      <a href="#">Personalize</a>
      <a href="#">Our Story</a>
      <a href="#">Contact</a>
    </nav>
    <div class="header-actions">
      <button type="button" class="btn-icon" aria-label="Open cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 6h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
      </button>
      <button type="button" class="btn-icon nav-toggle" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero__copy-col">
    <div class="hero__copy">
      <p class="hero__eyebrow">The Knot Necklace</p>
      <h1 class="hero__title">A Necklace That Turns a Moment Into a Memory</h1>
      <p class="hero__subtitle">A meaningful gift designed to celebrate the bond you never want to forget.</p>
      <a href="#" class="btn-gold">Shop the Necklace</a>
    </div>
  </div>
  <div class="hero__media-col">
    <video
      class="hero__video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      poster="assets/video/hero-poster.jpg"
      aria-label="Zaviqu knot pendant, studio showcase">
      <source src="assets/video/hero-knot-pendant.mp4" type="video/mp4">
    </video>
  </div>
</section>

<script src="js/main.js"></script>
</body>
</html>
